version: '3.9'

services:
  api:
    build: .
    container_name: courtvision-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./input_videos:/app/input_videos
      - ./output_videos:/app/output_videos
      - ./stubs:/app/stubs
      - ./data:/app/data
      - ./models:/app/models
      - ./configs:/app/configs
      - ./logs:/app/logs
      - .:/app  # Development convenience
    environment:
      - COURTVISION_OUTPUT_DIR=/app/output_videos
      - COURTVISION_STUBS_DIR=/app/stubs
      - COURTVISION_DATA_DIR=/app/data
      - COURTVISION_JOBS_DB_PATH=/app/data/jobs.db
    restart: unless-stopped

  frontend:
    build: .
    container_name: courtvision-frontend
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./input_videos:/app/input_videos
      - ./output_videos:/app/output_videos
      - ./stubs:/app/stubs
      - .:/app
    environment:
      - COURTVISION_API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
